services:
  app:
    build: .
    container_name: freelanding-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - RESEND_API_KEY=${RESEND_API_KEY}
      - CONTACT_EMAIL=${CONTACT_EMAIL}
    labels:
      - "traefik.http.services.app.loadbalancer.server.port=3000"
